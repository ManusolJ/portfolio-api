spring:
  application:
    name: portfolio-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DB_USER:portfolio}
    password: ${DB_PASSWORD}
  http:
    clients:
      read-timeout: 5s
      connect-timeout: 2s
  ai:
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      embedding:
        model: bge-m3
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 1024
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          timeout: 10000
          writetimeout: 10000
          connectiontimeout: 5000

app:
  mail:
    from: ${MAIL_FROM}
    contact-to: ${CONTACT_TO}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health
